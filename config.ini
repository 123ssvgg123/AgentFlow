; ============================================================
;  FoodAgent AI 智能餐饮 Agent 系统 · 配置文件
;  读取优先级：环境变量(.env) > 本文件 > 代码内 fallback 默认值
;  【重要】含密钥的配置请写入 .env（已被 .gitignore 排除），不要提交本文件中的敏感值
; ============================================================

[server]
; 监听地址（0.0.0.0 = 监听所有网卡）
host = 0.0.0.0
; 监听端口（与食安通 FoodSafetySystem 的 8080 错开）
port = 8090

[llm]
; DeepSeek 对话模型
model = deepseek-chat
; API 地址（OpenAI 兼容协议）
base_url = https://api.deepseek.com/v1
; API 密钥：请写入 .env 的 LLM_API_KEY，不要写在这里
api_key =
; 密钥名称（DeepSeek 控制台上的 key 名称，仅作标识，不参与鉴权）
api_key_name = tool
; 调用超时（秒）
timeout = 30

; 运行策略：远程模型最小验证（硬限制实现见 base/run_policy.py）
; 对话模型是 DeepSeek 远程 API（非本地部署、按 token 计费），
; 默认禁止跑完整一轮全量流程，只做最小限度验证。
[run_policy]
; 0 = 只准最小验证（默认）；1 = 允许全量（还必须同时传命令行 --allow-full）
allow_full_run = 0
; 单次运行最多样本条数
max_samples = 2
; 单次运行最多远程调用次数
max_llm_calls = 6
; 是否启用 LLM（false 时全部走规则引擎降级，便于离线联调）
enabled = true
; ---------- 备用模型（需求「主模型不可用 → 切换备用模型」） ----------
; 切换时机：主模型重试耗尽后，用备用模型再试一次；仍失败才走既有降级路径
; 是否启用备用模型切换（false = 关闭切换，行为与切换前完全一致）
fallback_enabled = true
; 备用模型名：留空 = 未配置备用模型（零回归）。
;   示例：同平台降级填 deepseek-reasoner；跨平台填另一个 OpenAI 兼容服务的模型名
fallback_model =
; 备用模型 API 地址：留空 = 沿用上面的 base_url
fallback_base_url =
; 备用模型 API 密钥：留空 = 沿用主 api_key；若填请写入 .env 的 LLM_FALLBACK_API_KEY
fallback_api_key = 
; 长期记忆 + LangGraph Checkpointer 使用
host = localhost
port = 5432
user = postgres
password = change-me
database = foodagent
; 是否启用 PostgreSQL（false → 内存 Checkpointer + JSON 文件记忆，零依赖可跑）
enabled = false

[milvus]
; 菜品/评价/食安向量检索（可选，未部署时 MCP 工具自动降级为本地知识库）
host = localhost
port = 19530
database_name = foodagent
menu_collection = foodagent_menu_kb

[jwt]
; JWT 签名密钥：生产环境务必通过 .env 覆盖为随机长串
secret = change-me-in-env
algorithm = HS256
; Token 有效期（分钟）
expire_minutes = 120

[kitchen]
; 排队订单数超过该阈值 → 触发 interrupt，暂停等后厨主管确认（Human-in-the-Loop）
interrupt_threshold = 10
; 后厨工位（逗号分隔）
stations = 凉菜间,热菜间,面点间,出菜口

[compliance]
; 过敏原合规留痕保留年限（需求：3 年备查）
log_years = 3
; 模型输出中的过敏原提示前缀（前端据此高亮）
allergen_alert_prefix = [过敏原警示]

[memory]
; 长期记忆清理/归档策略（需求 3.6.5：对话 90 天归档 / 门店偏好永久 /
; 顾客画像永久 / 评价分析 2 年；compliance_log 保留 3 年见上面 [compliance]）
; 【统一约定】值为 0 表示「永久保留，不清理」
; 生效方式：由外部定时任务调用 scripts/purge_expired.py（支持 --tenant / --dry-run），
;           挂载示例见 docs/OBSERVABILITY.md「记忆清理任务的外部调度」
; 对话记忆（LangGraph Checkpointer，按 thread_id 隔离）归档天数
conversation_retention_days = 90
; 评价分析记录保留天数（730 = 2 年）
review_retention_days = 730
; 订单状态流转日志保留天数（与对话同归档口径）
order_log_retention_days = 90
; 门店偏好保留天数：0 = 永久（需求明确「门店偏好永久」，不要改成非 0）
store_pref_retention_days = 0
; 顾客画像保留天数：0 = 永久（需求明确「顾客画像永久」，不要改成非 0）
customer_retention_days = 0

[app]
service_phone = 400-000-0000
; 对话历史保留轮数
history_rounds = 10
; 菜品推荐默认数量
recommend_top_k = 8
; 联网搜索失败时的缓存 TTL（秒）
web_search_cache_ttl = 86400


; ============================================================
;  以下为「可选重型组件」配置段
;  设计原则：全部默认 enabled = false，不安装依赖也不影响主流程；
;           需要时开启开关 + 装对应依赖即可，属于「渐进增强」。
;  依赖清单与启用步骤见 docs/OBSERVABILITY.md
; ============================================================

[langsmith]
; LangSmith 全链路追踪（观测 Agent 节点耗时、LLM 输入输出、工具调用链）
; 依赖：pip install langsmith langchain-core
; 启用后自动注入 LANGCHAIN_TRACING_V2 等环境变量
enabled = true
api_key = 
project = foodagent-dev
endpoint = https://api.smith.langchain.com
; 采样率（1.0 = 全量上报，0.1 = 10% 采样，生产建议 0.1~0.3）
sample_rate = 1.0

[redis]
; Redis 缓存（用于：门店偏好/顾客画像热点缓存、MCP 检索结果缓存、SSE 会话共享）
; 依赖：pip install redis
; 未启用时自动降级为进程内字典缓存（单机可用，重启失效）
enabled = true
host = localhost
port = 6379
; db 库隔离：本机 Redis 已被其他项目占用 db0，FoodAgent 用 db2，FoodSafetySystem 用 db1
db = 2
password = change-me
; 默认 TTL（秒）
default_ttl = 300
; 键前缀（多环境共用同一 Redis 时用于隔离）
key_prefix = foodagent:

[prometheus]
; Prometheus 指标暴露（/metrics 端点）
; 依赖：pip install prometheus-client
; 暴露指标：请求数/耗时直方图、Agent 阶段耗时、工具降级次数、LLM token 数
enabled = true
; 指标路径
metrics_path = /metrics
; 命名空间前缀
namespace = foodagent
; 是否统计每个 Agent 的节点级耗时（粒度更细，开销略高）
node_level_metrics = true

[loadtest]
; Locust 压测配置（脚本见 scripts/locustfile.py）
; 依赖：pip install locust
; 用法：locust -f scripts/locustfile.py --host http://127.0.0.1:8090
enabled = false
; 默认并发用户数
users = 50
; 每秒启动用户数
spawn_rate = 5
; 压测时长（秒），0 = 不限时（Web UI 手动停止）
run_time = 120
; 压测使用的门店/员工（会真实写入 FileStore/PG，建议用独立测试门店）
tenant_id = store_loadtest
user_id = loadtest_bot

[k8s]
; Kubernetes 部署（清单见 docs/deploy/k8s/）
; 说明：仅为规模化部署预留，本地开发用 docker-compose 即可
enabled = false
; 命名空间
namespace = foodagent
; 副本数
replicas = 2
; 单副本资源限额
cpu_request = 500m
cpu_limit = 2000m
memory_request = 1Gi
memory_limit = 2Gi
; 健康检查路径
liveness_path = /health
readiness_path = /health
; HPA 自动扩缩容
hpa_enabled = true
hpa_min_replicas = 2
hpa_max_replicas = 10
hpa_cpu_target = 70
