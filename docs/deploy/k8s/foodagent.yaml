# ============================================================
#  FoodAgent Kubernetes 部署清单（全部）
#  用法：kubectl apply -f docs/deploy/k8s/foodagent.yaml
#  说明：单文件形式便于审阅；生产建议拆分为多文件并用 Kustomize 管理环境差异
#  前置：镜像已构建并推送（见 README.md）
# ============================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: foodagent
  labels:
    app.kubernetes.io/name: foodagent
    app.kubernetes.io/part-of: foodagent-platform
---
# ============================================================
#  非敏感配置（ConfigMap）
#  对应 config.ini，敏感项（密钥）见 Secret
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: foodagent-config
  namespace: foodagent
data:
  # ---- 服务 ----
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8090"
  # ---- LLM（密钥在 Secret）----
  LLM_MODEL: "deepseek-chat"
  LLM_BASE_URL: "https://api.deepseek.com/v1"
  LLM_TIMEOUT: "30"
  LLM_ENABLED: "true"
  # ---- PostgreSQL（生产必须开启，多副本共享状态）----
  PG_HOST: "postgres.foodagent.svc.cluster.local"
  PG_PORT: "5432"
  PG_USER: "postgres"
  PG_DATABASE: "foodagent"
  PG_ENABLED: "true"
  # ---- Milvus 向量库（可选）----
  MILVUS_HOST: "milvus.foodagent.svc.cluster.local"
  MILVUS_PORT: "19530"
  # ---- 备用模型（留空 = 未启用）----
  LLM_FALLBACK_ENABLED: "true"
  LLM_FALLBACK_MODEL: ""
  # ---- 后厨调度 ----
  KITCHEN_INTERRUPT_THRESHOLD: "10"
  KITCHEN_STATIONS: "凉菜间,热菜间,面点间,出菜口"
  # ---- 合规 ----
  COMPLIANCE_LOG_YEARS: "3"
  # ---- 可观测性（生产建议全开）----
  LANGSMITH_ENABLED: "true"
  LANGSMITH_PROJECT: "foodagent-prod"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis.foodagent.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_KEY_PREFIX: "foodagent:prod:"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_NAMESPACE: "foodagent"
---
# ============================================================
#  敏感配置（Secret）
#  【安全警告】以下 value 仅为占位符，部署前必须替换为真实值，
#             并改用 SealedSecrets / External Secrets / Vault 等方案管理。
#             严禁把真实密钥提交到 Git。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: foodagent-secret
  namespace: foodagent
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_WITH_REAL_KEY"
  PG_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_RANDOM_LONG_STRING"
  LANGSMITH_API_KEY: "REPLACE_WITH_REAL_LANGSMITH_KEY"
  REDIS_PASSWORD: ""
---
# ============================================================
#  主服务 Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodagent-api
  namespace: foodagent
  labels:
    app: foodagent-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # 保证滚动更新期间零不可用
  selector:
    matchLabels:
      app: foodagent-api
  template:
    metadata:
      labels:
        app: foodagent-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8090"
    spec:
      # 优雅终止：给 SSE 长连接留出排空时间
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: foodagent-api
          image: foodagent:1.0.0          # ← 替换为你的镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: foodagent-config
            - secretRef:
                name: foodagent-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          # 存活探针：进程卡死 → 重启
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30      # 留时间给 MCP 探活 + 记忆初始化
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # 就绪探针：未就绪 → 摘除流量
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 启动探针：首次启动慢（模型加载）时避免被误杀
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24         # 最多容忍 120s 启动
          volumeMounts:
            - name: data
              mountPath: /app/data       # FileStore 降级时的落盘目录
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          emptyDir: {}                   # 生产应使用 PG；此处仅作降级兜底
        - name: logs
          emptyDir: {}
---
# ============================================================
#  Service（含会话保持，保障 SSE 不断流）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: foodagent-api
  namespace: foodagent
  labels:
    app: foodagent-api
spec:
  type: ClusterIP
  selector:
    app: foodagent-api
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  # 关键：SSE 流式接口需要会话保持，否则多副本下会中断
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800          # 3 小时
---
# ============================================================
#  Ingress（对外入口，SSE 超时需放宽）
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodagent-ingress
  namespace: foodagent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"    # SSE 长连接
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"        # 关闭缓冲，保证逐字输出
    nginx.ingress.kubernetes.io/affinity: "cookie"            # 配合上面用 cookie 亲和
    nginx.ingress.kubernetes.io/session-cookie-name: "foodagent_affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
spec:
  ingressClassName: nginx
  rules:
    - host: foodagent.example.com          # ← 替换为真实域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foodagent-api
                port:
                  number: 8090
---
# ============================================================
#  HPA（水平自动扩缩容）
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodagent-api-hpa
  namespace: foodagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodagent-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300     # 缩容更保守，避免抖动
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
# ============================================================
#  PDB（中断预算：滚动更新/节点维护时保证可用副本）
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foodagent-api-pdb
  namespace: foodagent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: foodagent-api
